<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Pages</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f7fa;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .project-list {
            list-style-type: none;
            padding: 0;
        }
        .project-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .project-link {
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
        }
        .project-link:hover {
            color: #2980b9;
        }
        .project-desc {
            color: #7f8c8d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>My GitHub Pages Projects</h1>
    <ul class="project-list">
        <li class="project-item">
            <a href="/react-vs-imperative" class="project-link">React vs. Imperative JavaScript Example</a>
            <p class="project-desc">A comparative presentation showing the difference between imperative vanilla JS and declarative React implementations.</p>
        </li>
        <!-- Add more projects here as needed -->
    </ul>
</body>
</html>
